<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIC Test - DriveClean</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-box {
            border: 2px solid #ccc;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #5dc862;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #4ba850;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
        img {
            max-width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>🧪 HEIC Конвертер - Тест</h1>
    
    <div class="test-box">
        <h2>Загрузите HEIC файл для тестирования</h2>
        <input type="file" id="heicInput" accept=".heic,.heif,image/heic,image/heif">
        <button onclick="testConversion()">Конвертировать</button>
        
        <div id="result" class="result" style="display: none;">
            <h3>Результат:</h3>
            <div id="resultText"></div>
            <div id="imagePreview"></div>
        </div>
    </div>

    <div class="test-box">
        <h3>Информация о браузере:</h3>
        <p><strong>User Agent:</strong> <span id="userAgent"></span></p>
        <p><strong>heic2any загружен:</strong> <span id="heicLoaded"></span></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script>
        // Проверка загрузки библиотеки
        document.getElementById('userAgent').textContent = navigator.userAgent;
        document.getElementById('heicLoaded').textContent = typeof heic2any !== 'undefined' ? '✅ Да' : '❌ Нет';

        async function testConversion() {
            const input = document.getElementById('heicInput');
            const resultDiv = document.getElementById('result');
            const resultText = document.getElementById('resultText');
            const imagePreview = document.getElementById('imagePreview');
            
            if (!input.files || input.files.length === 0) {
                alert('Выберите HEIC файл');
                return;
            }

            const file = input.files[0];
            resultDiv.style.display = 'block';
            resultText.innerHTML = '<p>Обработка...</p>';
            imagePreview.innerHTML = '';

            try {
                console.log('Начало конвертации:', file.name, file.type, file.size);

                if (typeof heic2any === 'undefined') {
                    throw new Error('Библиотека heic2any не загружена');
                }

                // Конвертация
                const convertedBlob = await heic2any({
                    blob: file,
                    toType: 'image/jpeg',
                    quality: 0.95
                });

                console.log('Конвертация успешна:', convertedBlob);

                const blobToUse = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;

                // Создание URL для предпросмотра
                const url = URL.createObjectURL(blobToUse);

                resultText.innerHTML = `
                    <p class="success">✅ Конвертация успешна!</p>
                    <p><strong>Оригинальный размер:</strong> ${(file.size / 1024 / 1024).toFixed(2)} MB</p>
                    <p><strong>Размер JPEG:</strong> ${(blobToUse.size / 1024 / 1024).toFixed(2)} MB</p>
                    <p><strong>Тип:</strong> ${blobToUse.type}</p>
                `;

                imagePreview.innerHTML = `<img src="${url}" alt="Converted image">`;

                // Кнопка скачивания
                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Скачать JPEG';
                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = file.name.replace(/\.(heic|heif)$/i, '.jpg');
                    a.click();
                };
                imagePreview.appendChild(downloadBtn);

            } catch (error) {
                console.error('Ошибка конвертации:', error);
                resultText.innerHTML = `
                    <p class="error">❌ Ошибка конвертации</p>
                    <p><strong>Сообщение:</strong> ${error.message}</p>
                    <p><strong>Стек:</strong></p>
                    <pre>${error.stack || 'Нет информации'}</pre>
                `;
            }
        }
    </script>
</body>
</html>
